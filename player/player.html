<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Player Ship — Beelzebub</title>
	<link rel="stylesheet" href="player.css">
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			background: #081209;
			--radar-green: #39ff14;
		}
		#playerShip {
			width: 120px;
			height: 120px;
		}
	</style>
</head>
<body>

	<div id="playerShip" aria-label="Beelzebub Battleship">
		<svg class="beelzebub-svg" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
			<defs>
				<linearGradient id="chitin" x1="0%" y1="0%" x2="100%" y2="0%">
					<stop offset="0%" stop-color="#3f472c" />
					<stop offset="45%" stop-color="#7c8759" />
					<stop offset="80%" stop-color="#a5af7e" />
					<stop offset="100%" stop-color="#535d3b" />
				</linearGradient>

				<linearGradient id="magentaCore" x1="0%" y1="0%" x2="100%" y2="0%">
					<stop offset="0%" stop-color="#5e2d48" />
					<stop offset="35%" stop-color="#c4749a" />
					<stop offset="70%" stop-color="#9e5378" />
					<stop offset="100%" stop-color="#4e5938" />
				</linearGradient>

				<linearGradient id="gunMetal" x1="0%" y1="0%" x2="100%" y2="0%">
					<stop offset="0%" stop-color="#697065" />
					<stop offset="100%" stop-color="#e3ecee" />
				</linearGradient>

				<radialGradient id="ventGlow" cx="50%" cy="50%" r="50%">
					<stop offset="0%" stop-color="#ffd266" />
					<stop offset="55%" stop-color="#ff551a" />
					<stop offset="100%" stop-color="#a61c00" />
				</radialGradient>
			</defs>

			<!-- OUTER SWEEPING SCYTHE WINGS -->
			<path d="M 64 50 C 48 30, 56 14, 98 12 C 136 10, 170 14, 192 22 C 166 23, 134 22, 102 27 C 82 30, 76 38, 78 48 Z"
				fill="url(#chitin)" stroke="#282e1b" stroke-width="1.5" />
			<path d="M 64 70 C 48 90, 56 106, 98 108 C 136 110, 170 106, 192 98 C 166 97, 134 98, 102 93 C 82 90, 76 82, 78 72 Z"
				fill="url(#chitin)" stroke="#282e1b" stroke-width="1.5" />

			<!-- INNER CURVED PINCER BLADES -->
			<path d="M 74 49 C 86 35, 118 28, 168 35 C 146 39, 118 42, 92 50 Z"
				fill="url(#chitin)" stroke="#2b321e" stroke-width="1.2" />
			<path d="M 74 71 C 86 85, 118 92, 168 85 C 146 81, 118 78, 92 70 Z"
				fill="url(#chitin)" stroke="#2b321e" stroke-width="1.2" />

			<!-- TWIN FORWARD WEAPON BARRELS -->
			<path d="M 146 53 L 184 54.5 L 184 57 L 146 57.5 Z" fill="url(#gunMetal)" stroke="#2b3029" stroke-width="0.8" />
			<path d="M 146 67 L 184 65.5 L 184 63 L 146 62.5 Z" fill="url(#gunMetal)" stroke="#2b3029" stroke-width="0.8" />

			<!-- MAIN CENTRAL FUSELAGE AND SPIKED TAIL -->
			<path d="M 6 60 L 62 49 C 82 43, 118 44, 158 53 L 172 60 L 158 67 C 118 76, 82 77, 62 71 Z"
				fill="url(#magentaCore)" stroke="#301826" stroke-width="1.4" />

			<!-- ARMORED DORSAL RIDGE -->
			<path d="M 28 60 L 74 53 C 102 51, 132 53, 162 60 C 132 67, 102 69, 74 67 Z"
				fill="url(#chitin)" opacity="0.72" />

			<!-- RIBBED TEXTURE DETAILS -->
			<g stroke="#2a1f24" stroke-width="1" opacity="0.6" fill="none">
				<line x1="24" y1="57" x2="24" y2="63" />
				<line x1="34" y1="55" x2="34" y2="65" />
				<line x1="44" y1="53" x2="44" y2="67" />
				<line x1="54" y1="51" x2="54" y2="69" />
				<path d="M 88 14 L 94 26 M 108 13 L 112 24 M 128 13 L 131 22 M 148 15 L 150 22" />
				<path d="M 88 106 L 94 94 M 108 107 L 112 96 M 128 107 L 131 98 M 148 105 L 150 98" />
			</g>

			<!-- GLOWING PLASMA VENTS -->
			<g class="bio-vent" fill="url(#ventGlow)">
				<ellipse cx="102" cy="50" rx="3.2" ry="1.6" />
				<ellipse cx="112" cy="50.5" rx="3.2" ry="1.6" />
				<ellipse cx="122" cy="51.5" rx="3" ry="1.5" />
				<ellipse cx="132" cy="52.5" rx="2.6" ry="1.4" />

				<ellipse cx="102" cy="70" rx="3.2" ry="1.6" />
				<ellipse cx="112" cy="69.5" rx="3.2" ry="1.6" />
				<ellipse cx="122" cy="68.5" rx="3" ry="1.5" />
				<ellipse cx="132" cy="67.5" rx="2.6" ry="1.4" />
			</g>

			<!-- CORE BIO-NODE -->
			<ellipse class="engine-glow" cx="76" cy="60" rx="8" ry="3.2" fill="#f3a8cc" />
		</svg>
	</div>

</body>
</html>
