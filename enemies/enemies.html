<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enemy Ships Preview</title>
    <link rel="stylesheet" href="enemies.css">
</head>
<body class="enemy-preview-page">
    <h1 class="preview-title">Enemy Fleet Registry</h1>

    <div class="enemy-showcase">
        <!-- RED: DEMON SHIP -->
        <div class="enemy-card">
            <div class="enemy-stage">
                <div class="enemy enemy--demon" aria-label="Red Demon Ship"></div>
            </div>
            <span class="enemy-label enemy-label--red">RED // DEMON SHIP</span>
        </div>

        <!-- YELLOW: ALIEN ENEMY -->
        <div class="enemy-card">
            <div class="enemy-stage">
                <div class="enemy enemy--alien" aria-label="Yellow Alien Enemy"></div>
            </div>
            <span class="enemy-label enemy-label--yellow">YELLOW // ALIEN ENEMY</span>
        </div>

        <!-- BLUE: NORMAL ENEMY SHIP -->
        <div class="enemy-card">
            <div class="enemy-stage">
                <div class="enemy enemy--normal" aria-label="Blue Normal Enemy Ship"></div>
            </div>
            <span class="enemy-label enemy-label--blue">BLUE // NORMAL SHIP</span>
        </div>
    </div>
</body>
</html>
