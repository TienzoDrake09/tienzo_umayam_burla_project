<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="enemies/enemies.css">
    <script src="script.js" defer></script>
    <title>Beelzebub Battle Ship Console</title>
</head>

<body>
    <h1 id="gameTitle">Beelzebub Battle Ship Console</h1>

    <!-- GAME CONTAINER -->

    <div id="gameContainer">
        
        <!-- LEFT CONTROLS -->
        <div id="leftControls">

            <!-- COCKPIT DISPLAY Ito lagay ko-->
            <div class="cockpit-row">
                <div class="cockpit-display">
                    <span class="cockpit-label">HULL</span>
                    <span class="cockpit-readout" id="livesValue">3</span>
                </div>
                <div class="cockpit-display">
                    <span class="cockpit-label">HDG</span>
                    <span class="cockpit-readout" id="facingValue">Sector 8</span>
                </div>
                <div class="cockpit-display">
                    <span class="cockpit-label">SCORE</span>
                    <span class="cockpit-readout" id="scoreValue">0</span>
                </div>
            </div>

            <!-- joystick + rotate buttons -->
            <div id="joystickZone">
                <div id="joystickBase">
                    <div id="joystickKnob"></div>
                </div>
            </div>

            <div class="rotate-row">
                <button id="rotLeft" aria-label="Rotate left">&#8634;</button>
                <button id="rotRight" aria-label="Rotate right">&#8635;</button>
            </div>
            <div id="hint">WASD / Arrows = aim<br>1-3 = ammo &nbsp; Z X C = fire</div>
        </div>

        <!-- RADAR SCREEN -->

        <div id="radarScreen">
        
            <!-- RADAR COORDINATES -->

            <div id="radarCoordinates" role="list">
                <div class="radar-coordinate-sector radar-sector--1" role="listitem" aria-label="Sector 1, northeast">
                    <span class="radar-coordinate radar-coordinate--a">1A</span>
                    <span class="radar-coordinate radar-coordinate--b">1B</span>
                    <span class="radar-coordinate radar-coordinate--c">1C</span>
                </div>
                <div class="radar-coordinate-sector radar-sector--2" role="listitem" aria-label="Sector 2, east">
                    <span class="radar-coordinate radar-coordinate--a">2A</span>
                    <span class="radar-coordinate radar-coordinate--b">2B</span>
                    <span class="radar-coordinate radar-coordinate--c">2C</span>
                </div>
                <div class="radar-coordinate-sector radar-sector--3" role="listitem" aria-label="Sector 3, southeast">
                    <span class="radar-coordinate radar-coordinate--a">3A</span>
                    <span class="radar-coordinate radar-coordinate--b">3B</span>
                    <span class="radar-coordinate radar-coordinate--c">3C</span>
                </div>
                <div class="radar-coordinate-sector radar-sector--4" role="listitem" aria-label="Sector 4, south">
                    <span class="radar-coordinate radar-coordinate--a">4A</span>
                    <span class="radar-coordinate radar-coordinate--b">4B</span>
                    <span class="radar-coordinate radar-coordinate--c">4C</span>
                </div>
                <div class="radar-coordinate-sector radar-sector--5" role="listitem" aria-label="Sector 5, southwest">
                    <span class="radar-coordinate radar-coordinate--a">5A</span>
                    <span class="radar-coordinate radar-coordinate--b">5B</span>
                    <span class="radar-coordinate radar-coordinate--c">5C</span>
                </div>
                <div class="radar-coordinate-sector radar-sector--6" role="listitem" aria-label="Sector 6, west">
                    <span class="radar-coordinate radar-coordinate--a">6A</span>
                    <span class="radar-coordinate radar-coordinate--b">6B</span>
                    <span class="radar-coordinate radar-coordinate--c">6C</span>
                </div>
                <div class="radar-coordinate-sector radar-sector--7" role="listitem" aria-label="Sector 7, northwest">
                    <span class="radar-coordinate radar-coordinate--a">7A</span>
                    <span class="radar-coordinate radar-coordinate--b">7B</span>
                    <span class="radar-coordinate radar-coordinate--c">7C</span>
                </div>
                <div class="radar-coordinate-sector radar-sector--8" role="listitem" aria-label="Sector 8, north">
                    <span class="radar-coordinate radar-coordinate--a">8A</span>
                    <span class="radar-coordinate radar-coordinate--b">8B</span>
                    <span class="radar-coordinate radar-coordinate--c">8C</span>
                </div>
            </div>

            <!-- ENEMY LAYER -->

            <div id="enemyLayer">
                <div class="enemy enemy--demon" style="left: 66%; top: 26%;" aria-label="Red Demon Ship"></div>
                <div class="enemy enemy--alien" style="left: 28%; top: 38%;" aria-label="Yellow Alien Enemy"></div>
                <div class="enemy enemy--normal" style="left: 72%; top: 68%;" aria-label="Blue Normal Enemy Ship"></div>
            </div>

        </div>

        <!-- RIGHT CONTROLS -->
        

        <div id="rightControls">
            
             <div class="panel-title">AMMO</div>
            <div class="switch-row">
                <button class="ammo-switch" data-color="red" aria-pressed="true">
                    <span class="switch-lamp"></span>
                    <span class="switch-lever"></span>
                    <span class="switch-name">RED</span>
                </button>
                <button class="ammo-switch" data-color="blue" aria-pressed="false">
                    <span class="switch-lamp"></span>
                    <span class="switch-lever"></span>
                    <span class="switch-name">BLUE</span>
                </button>
                <button class="ammo-switch" data-color="yellow" aria-pressed="false">
                    <span class="switch-lamp"></span>
                    <span class="switch-lever"></span>
                    <span class="switch-name">YELLOW</span>
                </button>
            </div>

            
            <div class="panel-title">FIRE / RANGE</div>
            <div class="range-row">
                <button class="range-btn" data-ring="0">CLOSE</button>
                <button class="range-btn" data-ring="1">MID</button>
                <button class="range-btn" data-ring="2">FAR</button>
            </div>

        </div>
    </div>
    <div id="settingsBar"></div>
</body>
</html>
